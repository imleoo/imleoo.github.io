  <rect x="72" y="190" width="104" height="30" rx="15" fill="#0F766E" opacity=".7"/><text x="90" y="210" fill="#CCFBF1" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">人人都能做</text>
