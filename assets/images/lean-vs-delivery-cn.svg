<svg width="1000" height="450" viewBox="0 0 1000 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="450" gradientUnits="userSpaceOnUse"><stop stop-color="#0F172A"/><stop offset=".5" stop-color="#1E293B"/><stop offset="1" stop-color="#0F172A"/></linearGradient>
    <linearGradient id="accent" x1="80" y1="0" x2="920" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#009E9F"/><stop offset=".45" stop-color="#6366F1"/><stop offset=".75" stop-color="#8B5CF6"/><stop offset="1" stop-color="#EC4899"/></linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="20" cy="20" r=".6" fill="#38BDF8" opacity=".14"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feFlood flood-color="#009E9F" flood-opacity=".45"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
